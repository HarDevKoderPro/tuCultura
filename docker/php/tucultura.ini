; Configuracion PHP del contenedor de TuCultura (VPS)

date.timezone = America/Bogota

; No exponer errores ni version al cliente; los errores van al log del contenedor
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; Subida de fotos (max 5 MB, validado en admin.php) y videos de productos
; (max 40 MB, VIDEO_PRODUCTO_MAX_BYTES) desde el admin
upload_max_filesize = 45M
post_max_size = 50M

; Sesiones persistentes (volumen tucultura_sessions)
session.save_path = /var/lib/php/sessions
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; OPcache: el codigo solo cambia al reconstruir la imagen
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

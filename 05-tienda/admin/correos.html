<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correos Enviados - Admin Tienda</title>

    <link rel="shortcut icon" href="../../01-principal/imagenes/LogoTCPCircle.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/tienda.css">
    <link rel="stylesheet" href="../../01-principal/css/normalize.css">
    <style>
        body { background: #f0f2f5; }
        .admin-sidebar { background: var(--color-primario); padding: 1rem; position: fixed; top: 0; left: 0; height: 100vh; width: 250px; z-index: 1000; }
        .admin-sidebar-logo { display: flex; align-items: center; gap: 0.5rem; padding: 1rem; color: #fff; text-decoration: none; margin-bottom: 1rem; }
        .admin-sidebar-logo img { height: 40px; }
        .admin-sidebar-logo span { font-weight: bold; }
        .admin-sidebar-menu { list-style: none; }
        .admin-sidebar-menu li a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: rgba(255,255,255,0.8); text-decoration: none; border-radius: var(--radio-borde); transition: var(--transicion); }
        .admin-sidebar-menu li a:hover, .admin-sidebar-menu li a.activo { background: rgba(255,255,255,0.1); color: #fff; }
        .admin-main { margin-left: 250px; padding: 1.5rem; min-height: 100vh; }
        .admin-header-bar { background: #fff; padding: 1rem 1.5rem; margin: -1.5rem -1.5rem 1.5rem; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--sombra); flex-wrap: wrap; gap: 1rem; }
        .filtros-correos { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .filtros-correos select, .filtros-correos input { padding: 0.5rem; border: 1px solid var(--color-borde); border-radius: var(--radio-borde); }
        .correo-estado { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .correo-estado.ok { background: #d4edda; color: #155724; }
        .correo-estado.error { background: #f8d7da; color: #721c24; }
        .correo-tipo { font-size: 0.8rem; color: #666; }
        .correo-meta p { margin: 0.25rem 0; word-break: break-word; }
        .correo-vista { width: 100%; height: 420px; border: 1px solid var(--color-borde); border-radius: var(--radio-borde); background: #fff; margin-top: 1rem; }
        @media (max-width: 768px) { .admin-sidebar { display: none; } .admin-main { margin-left: 0; } }
    </style>
</head>
<body>
    <aside class="admin-sidebar">
        <a href="index.html" class="admin-sidebar-logo">
            <img src="../../01-principal/imagenes/LogoTCPCircle.png" alt="Logo">
            <span>Admin Tienda</span>
        </a>
        <ul class="admin-sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="productos.html"><i class="fas fa-box"></i> Productos</a></li>
            <li><a href="categorias.html"><i class="fas fa-tags"></i> Categorías</a></li>
            <li><a href="pedidos.html"><i class="fas fa-shopping-bag"></i> Pedidos</a></li>
            <li><a href="correos.html" class="activo"><i class="fas fa-envelope"></i> Correos</a></li>
            <li><a href="bonos.html"><i class="fas fa-gift"></i> Bonos</a></li>
            <li><a href="../php/logout_admin.php" onclick="return confirm('¿Desea ir a la tienda? Se cerrará su sesión de administrador.');"><i class="fas fa-store"></i> Ver Tienda</a></li>
            <li style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 1rem;">
                <a href="../php/logout_admin.php" style="color: #ff6b6b;"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
            </li>
        </ul>
    </aside>

    <main class="admin-main">
        <div class="admin-header-bar">
            <h1 style="font-size: 1.5rem; color: var(--color-primario);"><i class="fas fa-envelope"></i> Correos Enviados</h1>
            <div class="filtros-correos">
                <input type="text" id="filtro-pedido" placeholder="N° de pedido">
                <select id="filtro-tipo" onchange="cargarCorreos()">
                    <option value="">Todos</option>
                    <option value="cliente">Al comprador</option>
                    <option value="tienda">Aviso a la tienda</option>
                </select>
                <button class="btn-accion editar" onclick="cargarCorreos()" title="Actualizar"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>

        <div class="admin-tabla-container">
            <table class="admin-tabla" id="tabla-correos">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>N° Pedido</th>
                        <th>Tipo</th>
                        <th>Destinatario</th>
                        <th>Asunto</th>
                        <th>Estado</th>
                        <th>Ver</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Detalle -->
    <div class="modal" id="modal-correo">
        <div class="modal-contenido" style="max-width: 760px;">
            <div class="modal-header">
                <h2>Detalle del Correo</h2>
                <button class="modal-cerrar" onclick="cerrarModal()">&times;</button>
            </div>
            <div id="modal-body"><div class="loading"><div class="spinner"></div></div></div>
        </div>
    </div>

    <script src="../../sweetalert2.min.js"></script>
    <script>
        const API_BASE = '../php/admin.php';
        const TIPOS = { cliente: 'Al comprador', tienda: 'Aviso a la tienda' };
        let correos = [];

        document.addEventListener('DOMContentLoaded', cargarCorreos);
        document.getElementById('filtro-pedido').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') cargarCorreos();
        });

        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.textContent = texto == null ? '' : String(texto);
            return div.innerHTML;
        }

        function estadoHtml(c) {
            return c.enviado
                ? '<span class="correo-estado ok"><i class="fas fa-check"></i> Enviado</span>'
                : `<span class="correo-estado error" title="${escaparHtml(c.error)}"><i class="fas fa-times"></i> Falló</span>`;
        }

        async function cargarCorreos() {
            const params = new URLSearchParams({ action: 'correos_listar' });
            const pedido = document.getElementById('filtro-pedido').value.trim();
            const tipo = document.getElementById('filtro-tipo').value;
            if (pedido) params.append('pedido', pedido);
            if (tipo) params.append('tipo', tipo);

            const tbody = document.querySelector('#tabla-correos tbody');
            tbody.innerHTML = '<tr><td colspan="7"><div class="loading"><div class="spinner"></div></div></td></tr>';

            try {
                const response = await fetch(`${API_BASE}?${params}`);
                const data = await response.json();

                if (data.success) {
                    correos = data.correos;
                    renderizarCorreos();
                } else {
                    Swal.fire('Error', data.error, 'error').then(() => window.location.href = '../index.html');
                }
            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = '<tr><td colspan="7">Error al cargar los correos</td></tr>';
            }
        }

        function renderizarCorreos() {
            const tbody = document.querySelector('#tabla-correos tbody');

            if (correos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7">No hay correos registrados</td></tr>';
                return;
            }

            tbody.innerHTML = correos.map(c => `
                <tr>
                    <td>${escaparHtml(c.fecha_formateada)}</td>
                    <td><strong>${escaparHtml(c.numero_pedido || '-')}</strong></td>
                    <td><span class="correo-tipo">${escaparHtml(TIPOS[c.tipo] || c.tipo)}</span></td>
                    <td>${escaparHtml(c.destinatario)}</td>
                    <td>${escaparHtml(c.asunto)}</td>
                    <td>${estadoHtml(c)}</td>
                    <td>
                        <button class="btn-accion editar" onclick="verCorreo(${parseInt(c.id, 10)})"><i class="fas fa-eye"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function verCorreo(id) {
            const modal = document.getElementById('modal-correo');
            const modalBody = document.getElementById('modal-body');
            modal.classList.add('activo');
            modalBody.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const response = await fetch(`${API_BASE}?action=correo_detalle&id=${id}`);
                const data = await response.json();

                if (!data.success) {
                    modalBody.innerHTML = `<p class="mensaje error">${escaparHtml(data.error)}</p>`;
                    return;
                }

                const c = data.correo;
                modalBody.innerHTML = `
                    <div class="correo-meta">
                        <p><strong>Fecha:</strong> ${escaparHtml(c.fecha_formateada)}</p>
                        <p><strong>Pedido:</strong> ${escaparHtml(c.numero_pedido || '-')}</p>
                        <p><strong>Tipo:</strong> ${escaparHtml(TIPOS[c.tipo] || c.tipo)}</p>
                        <p><strong>Para:</strong> ${escaparHtml(c.destinatario)}</p>
                        <p><strong>Asunto:</strong> ${escaparHtml(c.asunto)}</p>
                        <p><strong>Estado:</strong> ${estadoHtml(c)}</p>
                        ${c.error ? `<p><strong>Error:</strong> ${escaparHtml(c.error)}</p>` : ''}
                    </div>
                    <iframe class="correo-vista" sandbox title="Contenido del correo"></iframe>
                `;
                // Vista del HTML del correo aislada (sandbox sin scripts)
                modalBody.querySelector('iframe').srcdoc = c.cuerpo;
            } catch (error) {
                console.error('Error:', error);
                modalBody.innerHTML = '<p class="mensaje error">Error al cargar el correo</p>';
            }
        }

        function cerrarModal() {
            document.getElementById('modal-correo').classList.remove('activo');
        }

        document.getElementById('modal-correo').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) cerrarModal();
        });
    </script>
</body>
</html>
